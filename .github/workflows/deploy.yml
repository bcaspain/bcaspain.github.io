name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject secrets into HTML
        env:
          RJ_GAS_URL: ${{ secrets.RJ_GAS_URL }}
          DP_GAS_URL: ${{ secrets.DP_GAS_URL }}
          DP_RECAPTCHA_SITE_KEY: ${{ secrets.DP_RECAPTCHA_SITE_KEY }}
        run: |
          sed -i "s|__RJ_GAS_URL__|${RJ_GAS_URL}|g" html/rabindra-jayanti-register.html
          sed -i "s|__RJ_GAS_URL__|${RJ_GAS_URL}|g" html/rabindra-jayanti.html
          sed -i "s|__DP_GAS_URL__|${DP_GAS_URL}|g" html/registration.html
          sed -i "s|__DP_RECAPTCHA_SITE_KEY__|${DP_RECAPTCHA_SITE_KEY}|g" html/registration.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
