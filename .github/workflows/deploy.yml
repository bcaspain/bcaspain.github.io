name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Inject deploy config
        env:
          RJ_GAS_URL: ${{ secrets.RJ_GAS_URL }}
          DP_GAS_URL: ${{ secrets.DP_GAS_URL }}
          BLOG_GAS_URL: ${{ secrets.BLOG_GAS_URL }}
          DP_RECAPTCHA_SITE_KEY: ${{ secrets.DP_RECAPTCHA_SITE_KEY }}
          BLOG_RECAPTCHA_SITE_KEY: ${{ secrets.BLOG_RECAPTCHA_SITE_KEY }}
          MEDIA_BASE_URL: ${{ secrets.MEDIA_BASE_URL }}
        run: bash scripts/cloudflare-build.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
